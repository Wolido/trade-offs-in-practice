<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title>Transformer 推理分 prefill 与 decode 两个阶段：prefill 并行处理全部输入并产出 K/V 矩阵，decode 复用 K/V 逐个生成输出 token</title>

  <defs>
    <!-- 阶段流程箭头（深灰）：refX=0，底边在 x=0、尖端在 x=8，线端点连接底边中点 -->
    <marker id="arr-dark" markerWidth="8" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
    </marker>
    <!-- K/V 数据流箭头（灰）：同上 -->
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- 背景（白色卡片，GitHub 深色模式下依然可读） -->
  <rect width="960" height="500" fill="#ffffff"/>
  <rect x="1" y="1" width="958" height="498" rx="8" fill="none" stroke="#e2e8f0"/>

  <text x="480" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">Transformer 推理：prefill / decode 两阶段与 KV cache</text>

  <!-- ============ 左：输入 token 序列 ============ -->
  <g>
    <rect x="40" y="64" width="260" height="132" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <text x="170" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">输入 token 序列</text>

    <!-- token 色块条：稳定前缀（蓝） + 新增（红） -->
    <rect x="56" y="104" width="172" height="36" fill="#2563eb"/>
    <text x="142" y="128" text-anchor="middle" font-size="13" fill="#ffffff">稳定前缀</text>
    <rect x="228" y="104" width="56" height="36" fill="#dc2626"/>
    <text x="256" y="128" text-anchor="middle" font-size="13" fill="#ffffff">新增</text>

    <text x="142" y="162" text-anchor="middle" font-size="13" fill="#2563eb">系统提示词 + 历史消息</text>
    <text x="256" y="162" text-anchor="middle" font-size="13" fill="#dc2626">新问题</text>
    <text x="170" y="182" text-anchor="middle" font-size="13" fill="#64748b">前缀稳定，新内容追加在末尾</text>
  </g>

  <!-- 箭头：输入 → prefill；线端点 352，尖端 360 顶住 prefill 左边缘 -->
  <line x1="300" y1="122" x2="352" y2="122" stroke="#334155" stroke-width="2" marker-end="url(#arr-dark)"/>

  <!-- ============ 中：prefill 阶段（块最大 = 成本所在） ============ -->
  <g>
    <rect x="360" y="56" width="280" height="184" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <path d="M368,56 H632 A8,8 0 0 1 640,64 V92 H360 V64 A8,8 0 0 1 368,56 Z" fill="#2563eb"/>
    <text x="500" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">prefill 阶段</text>

    <text x="500" y="118" text-anchor="middle" font-size="14" fill="#334155">并行处理全部输入 token</text>
    <text x="500" y="142" text-anchor="middle" font-size="14" fill="#64748b">计算每个 token 的 K、V 向量</text>
    <line x1="384" y1="162" x2="616" y2="162" stroke="#e2e8f0" stroke-width="1"/>
    <text x="500" y="188" text-anchor="middle" font-size="14" fill="#334155">输入越长，此阶段开销越大</text>
    <text x="500" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">—— 成本主要在这里</text>
  </g>

  <!-- 箭头：prefill → K/V 矩阵；线端点 302，尖端 310 顶住 K/V 块上边缘 -->
  <line x1="500" y1="240" x2="500" y2="302" stroke="#64748b" stroke-width="2" marker-end="url(#arr-gray)"/>
  <text x="514" y="278" font-size="13" fill="#64748b">产出</text>

  <!-- K/V 矩阵（中间产物，辅色灰） -->
  <g>
    <rect x="400" y="310" width="200" height="100" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="500" y="342" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">K/V 矩阵</text>
    <text x="500" y="366" text-anchor="middle" font-size="13" fill="#64748b">prefill 的中间产物</text>
    <text x="500" y="388" text-anchor="middle" font-size="13" fill="#334155">只取决于输入内容</text>
  </g>

  <!-- 箭头：prefill → decode；线端点 712，尖端 720 顶住 decode 左边缘 -->
  <line x1="640" y1="150" x2="712" y2="150" stroke="#334155" stroke-width="2" marker-end="url(#arr-dark)"/>

  <!-- ============ 右：decode 阶段 ============ -->
  <g>
    <rect x="720" y="80" width="200" height="140" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <path d="M728,80 H912 A8,8 0 0 1 920,88 V116 H720 V88 A8,8 0 0 1 728,80 Z" fill="#2563eb"/>
    <text x="820" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">decode 阶段</text>

    <text x="820" y="142" text-anchor="middle" font-size="14" fill="#334155">逐个生成输出 token</text>
    <text x="820" y="166" text-anchor="middle" font-size="13" fill="#64748b">每步复用已算好的 K/V</text>
    <text x="820" y="190" text-anchor="middle" font-size="13" fill="#64748b">开销远小于 prefill</text>
  </g>

  <!-- 箭头：K/V 矩阵 → decode（肘形）；线端点 (830,228)，尖端 (830,220) 顶住 decode 下边缘 -->
  <polyline points="600,360 830,360 830,228" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr-gray)"/>
  <text x="780" y="348" text-anchor="middle" font-size="13" fill="#64748b">读取 K/V</text>

  <!-- ============ 图例 ============ -->
  <g>
    <line x1="56" y1="448" x2="80" y2="448" stroke="#334155" stroke-width="2" marker-end="url(#arr-dark)"/>
    <text x="98" y="452" font-size="13" fill="#334155">阶段流程</text>
    <line x1="190" y1="448" x2="214" y2="448" stroke="#64748b" stroke-width="2" marker-end="url(#arr-gray)"/>
    <text x="232" y="452" font-size="13" fill="#334155">K/V 数据流</text>
  </g>

  <text x="480" y="478" text-anchor="middle" font-size="13" fill="#64748b">注：K/V 矩阵只取决于输入内容——相同前缀的 K/V 可以直接复用，无需重算。</text>
</svg>
