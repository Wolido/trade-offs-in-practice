<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" font-family="system-ui, sans-serif">
  <title>约束的三种形态：提示词约束、工具白名单（能力约束）、流程闸门（时序约束），约束力从请求到结构递增</title>

  <defs>
    <!-- 递进轴箭头：refX=0，底边在 x=0、尖端在 x=8 -->
    <marker id="arr-axis" markerWidth="8" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- 背景（白色卡片，GitHub 深色模式下依然可读） -->
  <rect width="880" height="520" fill="#ffffff"/>
  <rect x="1" y="1" width="878" height="518" rx="8" fill="none" stroke="#e2e8f0"/>

  <!-- ============ 卡片 1：提示词约束（最软） ============ -->
  <g>
    <rect x="40" y="48" width="240" height="340" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <path d="M48,48 H272 A8,8 0 0 1 280,56 V88 H40 V56 A8,8 0 0 1 48,48 Z" fill="#64748b"/>
    <text x="58" y="74" font-size="15" font-weight="bold" fill="#ffffff">提示词约束</text>
    <!-- 失效提示徽章：跨框上边缘的标签页式徽章 -->
    <rect x="180" y="36" width="84" height="22" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="222" y="51" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">可被无视</text>

    <text x="58" y="114" font-size="13" fill="#64748b">约束强度</text>
    <text x="122" y="114" font-size="14" fill="#64748b">●○○</text>

    <text x="58" y="142" font-size="13" fill="#64748b">管什么</text>
    <text x="58" y="166" font-size="14" fill="#334155">管「应该怎么做」</text>
    <text x="58" y="188" font-size="14" fill="#64748b">本质：一句请求</text>

    <text x="58" y="216" font-size="13" fill="#64748b">例子</text>
    <text x="58" y="240" font-size="14" fill="#334155">系统提示词里写：</text>
    <text x="58" y="262" font-size="14" fill="#334155">“必须严格走 TDD”</text>
    <!-- 红色删除线：这句请求会被无视 -->
    <line x1="58" y1="257" x2="184" y2="257" stroke="#dc2626" stroke-width="1.5"/>

    <line x1="58" y1="308" x2="262" y2="308" stroke="#e2e8f0" stroke-width="1"/>
    <text x="58" y="334" font-size="13" font-weight="bold" fill="#dc2626">✕ 短板</text>
    <text x="58" y="358" font-size="14" fill="#dc2626">上下文一长、模型一固执</text>
    <text x="58" y="380" font-size="14" fill="#dc2626">约束即被无视</text>
  </g>

  <!-- ============ 卡片 2：工具白名单（能力约束） ============ -->
  <g>
    <rect x="320" y="48" width="240" height="340" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <path d="M328,48 H552 A8,8 0 0 1 560,56 V88 H320 V56 A8,8 0 0 1 328,48 Z" fill="#64748b"/>
    <text x="338" y="74" font-size="15" font-weight="bold" fill="#ffffff">工具白名单 · 能力约束</text>

    <text x="338" y="114" font-size="13" fill="#64748b">约束强度</text>
    <text x="402" y="114" font-size="14" fill="#64748b">●●○</text>

    <text x="338" y="142" font-size="13" fill="#64748b">管什么</text>
    <text x="338" y="166" font-size="14" fill="#334155">管「能不能做」</text>
    <text x="338" y="188" font-size="14" fill="#64748b">工具被移除即物理事实</text>

    <text x="338" y="216" font-size="13" fill="#64748b">例子</text>
    <text x="338" y="240" font-size="14" fill="#334155">主智能体没有：</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
      <rect x="338" y="252" width="52" height="22" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
      <text x="364" y="267" text-anchor="middle" fill="#dc2626">write</text>
      <line x1="342" y1="262" x2="386" y2="262" stroke="#dc2626" stroke-width="1.5"/>
      <rect x="398" y="252" width="44" height="22" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
      <text x="420" y="267" text-anchor="middle" fill="#dc2626">edit</text>
      <line x1="402" y1="262" x2="438" y2="262" stroke="#dc2626" stroke-width="1.5"/>
      <rect x="450" y="252" width="52" height="22" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
      <text x="476" y="267" text-anchor="middle" fill="#dc2626">bash</text>
      <line x1="454" y1="262" x2="498" y2="262" stroke="#dc2626" stroke-width="1.5"/>
    </g>

    <line x1="338" y1="308" x2="542" y2="308" stroke="#e2e8f0" stroke-width="1"/>
    <text x="338" y="334" font-size="13" font-weight="bold" fill="#dc2626">✕ 短板</text>
    <text x="338" y="358" font-size="14" fill="#dc2626">管不住时序，拦不住：</text>
    <text x="338" y="380" font-size="14" fill="#334155">「跳过 tester 直派 coder」</text>
  </g>

  <!-- ============ 卡片 3：流程闸门（时序约束，本文主角） ============ -->
  <g>
    <rect x="600" y="48" width="240" height="340" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <path d="M608,48 H832 A8,8 0 0 1 840,56 V88 H600 V56 A8,8 0 0 1 608,48 Z" fill="#2563eb"/>
    <text x="618" y="74" font-size="15" font-weight="bold" fill="#ffffff">流程闸门 · 时序约束</text>
    <!-- 主角徽章：跨框上边缘的标签页式徽章 -->
    <rect x="740" y="36" width="84" height="22" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="782" y="51" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">本文主角</text>

    <text x="618" y="114" font-size="13" fill="#64748b">约束强度</text>
    <text x="682" y="114" font-size="14" fill="#2563eb">●●●</text>

    <text x="618" y="142" font-size="13" fill="#64748b">管什么</text>
    <text x="618" y="166" font-size="14" fill="#334155">管「必须先做什么」</text>
    <text x="618" y="188" font-size="14" fill="#64748b">在派遣事件上拦截</text>

    <text x="618" y="216" font-size="13" fill="#64748b">例子</text>
    <text x="618" y="240" font-size="14" fill="#334155">tdd-guard 扩展：</text>
    <text x="618" y="262" font-size="14" fill="#334155">无 RED 令牌时，</text>
    <text x="618" y="284" font-size="14" fill="#334155">派 coder 即被拦截</text>

    <line x1="618" y1="308" x2="822" y2="308" stroke="#e2e8f0" stroke-width="1"/>
    <text x="618" y="334" font-size="13" font-weight="bold" fill="#2563eb">✓ 关键</text>
    <text x="618" y="358" font-size="14" fill="#2563eb">事件级拦截：把流程纪律</text>
    <text x="618" y="380" font-size="14" fill="#2563eb">放进结构，而非提示词</text>
  </g>

  <!-- ============ 底部递进轴：约束力从请求到结构 ============ -->
  <g>
    <text x="444" y="424" text-anchor="middle" font-size="14" fill="#334155">约束力：软 → 硬（从请求到结构）</text>
    <line x1="110" y1="446" x2="770" y2="446" stroke="#64748b" stroke-width="2" marker-end="url(#arr-axis)"/>
    <text x="160" y="474" text-anchor="middle" font-size="14" fill="#64748b">请求</text>
    <text x="440" y="474" text-anchor="middle" font-size="14" fill="#64748b">能力</text>
    <text x="720" y="474" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563eb">结构</text>
  </g>
</svg>
