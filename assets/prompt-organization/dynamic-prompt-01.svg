<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" font-family="system-ui, sans-serif">
  <title>子智能体提示词的两层结构：静态层来自 agent 定义文件，跨调用不变、缓存可命中；动态层来自主智能体委派时写的 task，随项目和任务变化</title>

  <defs>
    <marker id="arr-down" markerWidth="8" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- 背景（白色卡片，GitHub 深色模式下依然可读） -->
  <rect width="880" height="470" fill="#ffffff"/>
  <rect x="1" y="1" width="878" height="468" rx="8" fill="none" stroke="#e2e8f0"/>

  <!-- ============ 主智能体 ============ -->
  <rect x="330" y="36" width="220" height="48" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="66" text-anchor="middle" font-size="16" font-weight="bold" fill="#2563eb">主智能体</text>

  <!-- 委派箭头 -->
  <line x1="440" y1="86" x2="440" y2="142" stroke="#64748b" stroke-width="2" marker-end="url(#arr-down)"/>
  <text x="458" y="122" font-size="13" fill="#64748b">委派时写 <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">task</tspan></text>

  <!-- ============ 子智能体的提示词容器 ============ -->
  <rect x="60" y="150" width="760" height="260" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="440" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">子智能体的提示词 = 静态层 + 动态层</text>

  <!-- 静态层 -->
  <g>
    <rect x="100" y="200" width="330" height="180" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <path d="M108,200 H422 A8,8 0 0 1 430,208 V236 H100 V208 A8,8 0 0 1 108,200 Z" fill="#2563eb"/>
    <text x="118" y="224" font-size="15" font-weight="bold" fill="#ffffff">静态层 · agent 定义文件</text>

    <text x="118" y="266" font-size="14" fill="#334155">角色定位、职责边界、</text>
    <text x="118" y="288" font-size="14" fill="#334155">工具白名单、skill 清单</text>

    <line x1="118" y1="312" x2="412" y2="312" stroke="#e2e8f0" stroke-width="1"/>
    <text x="118" y="340" font-size="13" fill="#2563eb">跨调用不变，作为稳定前缀</text>
    <text x="118" y="362" font-size="13" fill="#2563eb">缓存可命中，一次付钱多次摊销</text>
  </g>

  <!-- 动态层 -->
  <g>
    <rect x="450" y="200" width="330" height="180" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <path d="M458,200 H772 A8,8 0 0 1 780,208 V236 H450 V208 A8,8 0 0 1 458,200 Z" fill="#64748b"/>
    <text x="468" y="224" font-size="15" font-weight="bold" fill="#ffffff">动态层 · 委派时的 <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">task</tspan></text>

    <text x="468" y="266" font-size="14" fill="#334155">背景、输入、要求、输出格式，</text>
    <text x="468" y="288" font-size="14" fill="#334155">随项目和任务变化，每次重写</text>

    <line x1="468" y1="312" x2="762" y2="312" stroke="#e2e8f0" stroke-width="1"/>
    <text x="468" y="340" font-size="13" fill="#64748b">注入范围精确，内容可见可审计</text>
    <text x="468" y="362" font-size="13" fill="#dc2626">质量取决于主智能体的写作水平</text>
  </g>

  <!-- 底部注脚 -->
  <text x="440" y="444" text-anchor="middle" font-size="13" fill="#64748b">项目知识不经框架注入，由主智能体在委派时定向传递</text>
</svg>
