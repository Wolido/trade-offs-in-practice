<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" width="960" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title>OpenAaaS 查询端到端工作流：对话式智能体经网络层路由至执行节点，查询在数据本地完成</title>

  <defs>
    <!-- 蓝色向下/前进箭头：refX=0，底边在 x=0、尖端在 x=8，线端点连接箭头底边中点 -->
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <!-- 灰色返回箭头：同上，灰色 -->
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- 背景（白色卡片，GitHub 深色模式下依然可读） -->
  <rect width="960" height="800" fill="#ffffff"/>
  <rect x="1" y="1" width="958" height="798" rx="8" fill="none" stroke="#e2e8f0"/>

  <!-- ============ 客户端智能体分组 ============ -->
  <g>
    <rect x="330" y="32" width="300" height="100" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <text x="350" y="60" font-size="15" font-weight="bold" fill="#64748b">客户端智能体</text>
    <rect x="390" y="74" width="180" height="42" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="480" y="101" text-anchor="middle" font-size="15" fill="#334155">对话式智能体</text>
  </g>

  <!-- ============ 网络层分组 ============ -->
  <g>
    <rect x="330" y="180" width="300" height="120" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="350" y="208" font-size="15" font-weight="bold" fill="#2563eb">网络层</text>
    <rect x="360" y="226" width="240" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="480" y="249" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">OpenAaaS Server</text>
    <text x="480" y="269" text-anchor="middle" font-size="13" fill="#334155">服务注册 / 任务路由</text>
  </g>

  <!-- ============ 执行节点分组（数据本地） ============ -->
  <g>
    <rect x="40" y="356" width="880" height="374" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="60" y="384" font-size="15" font-weight="bold" fill="#2563eb">执行节点（数据本地）</text>

    <!-- 智能体核心 -->
    <rect x="385" y="412" width="190" height="48" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="480" y="442" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">智能体核心</text>

    <!-- Docker 沙箱 -->
    <rect x="385" y="516" width="190" height="64" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="480" y="553" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">Docker 沙箱</text>

    <!-- Administrator.skill（文章主角，实心蓝强调） -->
    <rect x="695" y="516" width="200" height="64" rx="6" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <text x="795" y="542" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Administrator.skill</text>
    <text x="795" y="564" text-anchor="middle" font-size="13" fill="#dbeafe">管理员的查询经验封装</text>

    <!-- 描述符数据库（圆柱，TB 级 · 原地不动） -->
    <path d="M710,639 L710,695 A85,11 0 0 0 880,695 L880,639 Z" fill="#f1f5f9"/>
    <ellipse cx="795" cy="639" rx="85" ry="11" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <path d="M710,639 L710,695 A85,11 0 0 0 880,695 L880,639" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <text x="795" y="668" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">描述符数据库</text>
    <text x="795" y="690" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">TB 级 · 原地不动</text>
  </g>

  <!-- ============ 编号步骤箭头（先画线，后画标签） ============ -->
  <!-- ① 发现服务：Agent → Server，尖端顶 Server 上边缘 y=226 -->
  <line x1="435" y1="116" x2="435" y2="218" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <!-- ② 任务路由：Server → Core，尖端顶 Core 上边缘 y=412 -->
  <line x1="435" y1="282" x2="435" y2="404" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <!-- ③ 本地挂载：Core → Docker，尖端顶 Docker 上边缘 y=516 -->
  <line x1="480" y1="460" x2="480" y2="508" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <!-- ④ 调用 Skill：Docker → Skill，尖端顶 Skill 左边缘 x=695 -->
  <line x1="575" y1="538" x2="687" y2="538" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <!-- ⑤ 执行查询：Skill → 数据库，尖端顶圆柱顶面曲线 y=628 -->
  <line x1="795" y1="580" x2="795" y2="620" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <!-- ⑥ 写入结果：Skill → Docker，尖端顶 Docker 右边缘 x=575 -->
  <line x1="695" y1="566" x2="583" y2="566" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <!-- ⑦ 返回结果：Core → Server，灰色虚线，长度 122=10×12+2，末端 dash 与 marker 底边无缝衔接，尖端顶 Server 下边缘 y=282 -->
  <line x1="525" y1="412" x2="525" y2="290" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr-gray)"/>
  <!-- ⑧ 获取结果：Server → Agent，灰色虚线，长度 102=8×12+6，末端 dash 与 marker 底边无缝衔接，尖端顶 Agent 下边缘 y=116 -->
  <line x1="525" y1="226" x2="525" y2="124" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr-gray)"/>

  <!-- ============ 步骤标签（避开箭头 head、箭杆与框边） ============ -->
  <g font-size="14">
    <text x="423" y="162" text-anchor="end" fill="#2563eb">① 发现服务</text>
    <text x="537" y="162" text-anchor="start" fill="#64748b">⑧ 获取结果</text>
    <text x="423" y="334" text-anchor="end" fill="#2563eb">② 任务路由</text>
    <text x="537" y="334" text-anchor="start" fill="#64748b">⑦ 返回结果</text>
    <text x="492" y="493" text-anchor="start" fill="#2563eb">③ 本地挂载</text>
    <text x="635" y="524" text-anchor="middle" fill="#2563eb">④ 调用 Skill</text>
    <text x="635" y="582" text-anchor="middle" fill="#2563eb">⑥ 写入结果</text>
    <text x="783" y="609" text-anchor="end" fill="#2563eb">⑤ 执行查询</text>
  </g>

  <!-- ============ 图例 ============ -->
  <g>
    <line x1="273" y1="760" x2="297" y2="760" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
    <text x="317" y="765" font-size="14" fill="#334155">请求与执行（①–⑥）</text>
    <!-- 虚线图例：长度 26=2×12+2，末端 dash 与 marker 底边无缝衔接 -->
    <line x1="533" y1="760" x2="559" y2="760" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr-gray)"/>
    <text x="579" y="765" font-size="14" fill="#334155">结果返回（⑦⑧）</text>
  </g>
</svg>
