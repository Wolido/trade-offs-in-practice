<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" width="840" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title>数据管理方案：单文件 + SQLite 管写入记录 + DuckDB 管分析查询，嵌入式零运维</title>

  <defs>
    <!-- 灰色箭头：refX=0，底边在 x=0、尖端在 x=8，线端点连接底边中点 -->
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <!-- 蓝色箭头：同上 -->
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- 背景（白色卡片，GitHub 深色模式下依然可读） -->
  <rect width="840" height="460" fill="#ffffff"/>

  <!-- ==================== 外框：嵌入式 · 单文件 · 零运维 ==================== -->
  <rect x="24" y="24" width="792" height="408" rx="12" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="8 6"/>
  <rect x="322" y="11" width="196" height="26" rx="4" fill="#f1f5f9" stroke="#64748b"/>
  <text x="420" y="29" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">嵌入式 · 单文件 · 零运维</text>

  <!-- ==================== 顶部：数据文件 ==================== -->
  <rect x="260" y="64" width="320" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <!-- 文件图标（折角文档） -->
  <path d="M310,76 H330 L342,88 V116 H310 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <path d="M330,76 V88 H342" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <text x="354" y="94" font-size="16" font-weight="bold" fill="#334155">项目数据文件（单文件）</text>
  <text x="354" y="116" font-size="13" fill="#64748b">一个文件，跟着项目走</text>

  <!-- ==================== 分流总线：同一个数据，两种用法 ==================== -->
  <line x1="420" y1="128" x2="420" y2="156" stroke="#64748b" stroke-width="2"/>
  <line x1="260" y1="156" x2="580" y2="156" stroke="#64748b" stroke-width="2"/>
  <rect x="335" y="138" width="170" height="20" fill="#ffffff"/>
  <text x="420" y="152" text-anchor="middle" font-size="13" fill="#64748b">同一个数据，两种用法</text>

  <!-- 向下箭头：尖端顶住引擎框上边缘（y=194） -->
  <line x1="260" y1="156" x2="260" y2="186" stroke="#64748b" stroke-width="2" marker-end="url(#arr-gray)"/>
  <line x1="580" y1="156" x2="580" y2="186" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- ==================== SQLite（灰系）：行存储 · 管写入与记录 ==================== -->
  <g>
    <rect x="120" y="194" width="280" height="194" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <path d="M128,194 H392 A8,8 0 0 1 400,202 V228 H120 V202 A8,8 0 0 1 128,194 Z" fill="#64748b"/>
    <text x="260" y="217" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">SQLite</text>

    <text x="260" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">行存储 · 管写入与记录</text>
    <text x="260" y="288" text-anchor="middle" font-size="14" fill="#64748b">增删改查 · 日常记录</text>
    <text x="260" y="312" text-anchor="middle" font-size="14" fill="#64748b">适合：取某条完整记录</text>

    <!-- 迷你横条：呼应行存储（整行连续） -->
    <rect x="205" y="330" width="110" height="10" rx="2" fill="#e2e8f0" stroke="#94a3b8"/>
    <rect x="205" y="346" width="110" height="10" rx="2" fill="#e2e8f0" stroke="#94a3b8"/>
    <rect x="205" y="362" width="110" height="10" rx="2" fill="#e2e8f0" stroke="#94a3b8"/>
  </g>

  <!-- ==================== DuckDB（主蓝，加粗描边突出）：列存储 · 管分析查询 ==================== -->
  <g>
    <rect x="440" y="194" width="280" height="194" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
    <path d="M448,194 H712 A8,8 0 0 1 720,202 V228 H440 V202 A8,8 0 0 1 448,194 Z" fill="#2563eb"/>
    <text x="580" y="217" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">DuckDB</text>

    <text x="580" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#2563eb">列存储 · 管分析查询</text>
    <text x="580" y="288" text-anchor="middle" font-size="14" fill="#64748b">聚合统计 · 跨样品分析</text>
    <text x="580" y="312" text-anchor="middle" font-size="14" fill="#64748b">适合：批量分析与统计</text>

    <!-- 迷你竖条：呼应列存储（整列连续） -->
    <rect x="529" y="330" width="18" height="42" rx="2" fill="#dbeafe" stroke="#93c5fd"/>
    <rect x="557" y="330" width="18" height="42" rx="2" fill="#dbeafe" stroke="#93c5fd"/>
    <rect x="585" y="330" width="18" height="42" rx="2" fill="#dbeafe" stroke="#93c5fd"/>
    <rect x="613" y="330" width="18" height="42" rx="2" fill="#dbeafe" stroke="#93c5fd"/>
  </g>

  <!-- ==================== 底部场景小字 ==================== -->
  <text x="420" y="414" text-anchor="middle" font-size="13" fill="#64748b">科研场景：低并发、单机、数据跟着项目走</text>
</svg>
